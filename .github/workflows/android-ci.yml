name: Build AntiGem Assistant APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.1

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          chmod +x latest/bin/*
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install SDK components
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --console=plain --no-daemon --info 2>&1 | tail -100 || true
          echo "=== Build completed ==="

      - name: Find APK
        run: |
          echo "=== Finding APK files ==="
          find . -name "*.apk" -not -path "*/node_modules/*" 2>/dev/null | head -20
          echo "=== Checking build directory ==="
          ls -la app/build/ 2>/dev/null
          ls -la app/build/outputs/ 2>/dev/null
          ls -la app/build/outputs/apk/ 2>/dev/null
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK dir"
          echo "=== Done ==="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigem-assistant-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 7
